[package]
name = "delta-rpc"
version = "0.1.0"
edition = "2021"
description = "Lightweight Discord Rich Presence bridge for DELTARUNE"
license = "MIT"

[dependencies]
discord-rich-presence = "0.2"
png = "0.18.1"
serde = "1.0.229"
serde_json = "1.0.151"
sysinfo = "0.33"

[target."cfg(target_os = \"linux\")".dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
